<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 440" role="img" aria-labelledby="epochs-title epochs-desc">
<title id="epochs-title">Epoch labels and exact joins</title><desc id="epochs-desc">Synthetic five-second, 100 Hz example. Center-labelled ENMO and Activity Index have different timestamps; an exact join retains unpaired NA cells.</desc>
<defs><marker id="epochs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#79c0ff"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#e6edf3}.heading{font-size:23px;font-weight:600}.body{font-size:18px}.small{font-size:16px;fill:#b5c0ce}.code{font-family:Consolas,monospace;font-size:16px}.frame{fill:#161b22;stroke:#586574;stroke-width:1.5}.optional{stroke-dasharray:7 5}.arrow{fill:none;stroke:#79c0ff;stroke-width:2;marker-end:url(#epochs-arrow)}.guide-node:focus{outline:none}.guide-node:hover text,.guide-node:focus text{fill:#79c0ff}.guide-node:hover .frame,.guide-node:focus .frame{stroke:#79c0ff;stroke-width:2.5}</style>
<rect width="1250" height="440" rx="10" fill="#0d1117"/>
<rect x="25" y="25" width="770" height="390" rx="6" class="frame"/><rect x="825" y="25" width="400" height="390" rx="6" class="frame"/><text x="50" y="65" class="heading" text-anchor="start">Center labels: 5 s, 100 Hz</text><text x="850" y="65" class="heading" text-anchor="start">Exact timestamp join</text><path d="M200 115 H750" stroke="#9da7b3" stroke-width="2"/><path d="M200 105 V125" stroke="#9da7b3"/><text x="200" y="150" class="small" text-anchor="middle">0.00 s</text><path d="M474 105 V125" stroke="#9da7b3"/><text x="474" y="150" class="small" text-anchor="middle">2.49 s</text><path d="M750 105 V125" stroke="#9da7b3"/><text x="750" y="150" class="small" text-anchor="middle">4.99 s</text><text x="55" y="213" class="body" text-anchor="start">ENMO</text><text x="55" y="293" class="body" text-anchor="start">Activity Index</text><path d="M200 205 H750" stroke="#586574" stroke-dasharray="4 4"/><path d="M200 285 H750" stroke="#586574" stroke-dasharray="4 4"/><g class="guide-node" tabindex="0" role="group" aria-label="At 100 Hz, the 500 observed samples run from 0.00 to 4.99 s. The center label selects observed sample 250, at 2.49 s."><title>At 100 Hz, the 500 observed samples run from 0.00 to 4.99 s. The center label selects observed sample 250, at 2.49 s.</title><circle cx="474" cy="205" r="8" fill="#79c0ff"/><text x="474" y="240" class="small" text-anchor="middle">2.49 s</text></g><g class="guide-node" tabindex="0" role="group" aria-label="Activity Index aggregates one-second values whose bin starts are 0, 1, 2, 3 and 4 s. Its center epoch label is 2.00 s."><title>Activity Index aggregates one-second values whose bin starts are 0, 1, 2, 3 and 4 s. Its center epoch label is 2.00 s.</title><circle cx="420" cy="285" r="8" fill="#39c5bb"/><text x="420" y="320" class="small" text-anchor="middle">2.00 s</text></g><text x="410" y="383" class="body" text-anchor="middle">Same epoch interval, different labels</text><text x="890" y="120" class="small" text-anchor="middle">time (s)</text><text x="1025" y="120" class="small" text-anchor="middle">ENMO</text><text x="1150" y="120" class="small" text-anchor="middle">Activity Index</text><path d="M845 140 H1205 M845 215 H1205 M845 290 H1205" stroke="#586574"/><text x="890" y="185" class="code" text-anchor="middle">2.00</text><text x="1025" y="185" class="code" text-anchor="middle">NA</text><text x="1150" y="185" class="code" text-anchor="middle">value</text><text x="890" y="260" class="code" text-anchor="middle">2.49</text><text x="1025" y="260" class="code" text-anchor="middle">value</text><text x="1150" y="260" class="code" text-anchor="middle">NA</text><text x="1025" y="340" class="body" text-anchor="middle">NA: no matching label</text><text x="1025" y="370" class="small" text-anchor="middle">Not necessarily missing samples</text>
</svg>
