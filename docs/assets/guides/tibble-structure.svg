<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="tibble-title tibble-desc">
<title id="tibble-title">Metronautica Tibble structure</title><desc id="tibble-desc">Four required sample columns and optional file, acquisition and processing metadata. The symbolic rows illustrate structure, not measured values.</desc>
<defs><marker id="tibble-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#79c0ff"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#e6edf3}.heading{font-size:23px;font-weight:600}.body{font-size:18px}.small{font-size:16px;fill:#b5c0ce}.code{font-family:Consolas,monospace;font-size:16px}.frame{fill:#161b22;stroke:#586574;stroke-width:1.5}.optional{stroke-dasharray:7 5}.arrow{fill:none;stroke:#79c0ff;stroke-width:2;marker-end:url(#tibble-arrow)}.guide-node:focus{outline:none}.guide-node:hover text,.guide-node:focus text{fill:#79c0ff}.guide-node:hover .frame,.guide-node:focus .frame{stroke:#79c0ff;stroke-width:2.5}</style>
<rect width="1200" height="450" rx="10" fill="#0d1117"/>
<text x="45" y="48" class="heading" text-anchor="start">Required samples</text><text x="825" y="48" class="heading" text-anchor="start">Optional metadata</text><rect x="40" y="75" width="700" height="270" rx="6" class="frame"/><path d="M295 75 V345" stroke="#586574"/><path d="M443 75 V345" stroke="#586574"/><path d="M591 75 V345" stroke="#586574"/><path d="M40 145 H740" stroke="#586574"/><path d="M40 205 H740" stroke="#586574"/><path d="M40 265 H740" stroke="#586574"/><text x="168" y="118" class="code" text-anchor="middle">time</text><text x="369" y="118" class="code" text-anchor="middle">ax_g</text><text x="517" y="118" class="code" text-anchor="middle">ay_g</text><text x="665" y="118" class="code" text-anchor="middle">az_g</text><g class="guide-node" tabindex="0" role="group" aria-label="Sample timestamp; UTC storage convention. Supplied instants and timezone are preserved by the constructor."><title>Sample timestamp; UTC storage convention. Supplied instants and timezone are preserved by the constructor.</title><text x="168" y="183" class="body" text-anchor="middle">POSIXct</text></g><g class="guide-node" tabindex="0" role="group" aria-label="Numeric acceleration on the device X axis, in g."><title>Numeric acceleration on the device X axis, in g.</title><text x="369" y="183" class="body" text-anchor="middle">numeric <tspan font-style="italic">g</tspan></text></g><g class="guide-node" tabindex="0" role="group" aria-label="Numeric acceleration on the device Y axis, in g."><title>Numeric acceleration on the device Y axis, in g.</title><text x="517" y="183" class="body" text-anchor="middle">numeric <tspan font-style="italic">g</tspan></text></g><g class="guide-node" tabindex="0" role="group" aria-label="Numeric acceleration on the device Z axis, in g."><title>Numeric acceleration on the device Z axis, in g.</title><text x="665" y="183" class="body" text-anchor="middle">numeric <tspan font-style="italic">g</tspan></text></g><text x="168" y="242" class="body" text-anchor="middle">t<tspan baseline-shift="sub" font-size="13">1</tspan></text><text x="369" y="242" class="body" text-anchor="middle">a<tspan baseline-shift="sub" font-size="13">x,1</tspan></text><text x="517" y="242" class="body" text-anchor="middle">a<tspan baseline-shift="sub" font-size="13">y,1</tspan></text><text x="665" y="242" class="body" text-anchor="middle">a<tspan baseline-shift="sub" font-size="13">z,1</tspan></text><text x="168" y="302" class="body" text-anchor="middle">t<tspan baseline-shift="sub" font-size="13">2</tspan></text><text x="369" y="302" class="body" text-anchor="middle">a<tspan baseline-shift="sub" font-size="13">x,2</tspan></text><text x="517" y="302" class="body" text-anchor="middle">a<tspan baseline-shift="sub" font-size="13">y,2</tspan></text><text x="665" y="302" class="body" text-anchor="middle">a<tspan baseline-shift="sub" font-size="13">z,2</tspan></text><text x="390" y="380" class="small" text-anchor="middle">One decoded observation per row</text><path d="M740 210 H790" class="arrow" stroke-dasharray="6 5"/><g class="guide-node" tabindex="0" role="group" aria-label="Optional metadata are stored in attr(x, &quot;meta&quot;). No metadata field is required for core conformance."><title>Optional metadata are stored in attr(x, &quot;meta&quot;). No metadata field is required for core conformance.</title><rect x="800" y="75" width="360" height="270" rx="6" class="frame optional"/><text x="980" y="113" class="code" text-anchor="middle">attr(x, "meta")</text></g><g class="guide-node" tabindex="0" role="group" aria-label="Source identity, format and decoding provenance."><title>Source identity, format and decoding provenance.</title><text x="825" y="164" class="code" text-anchor="start">file</text><text x="825" y="190" class="small" text-anchor="start">Source identity</text></g><g class="guide-node" tabindex="0" role="group" aria-label="Device identifiers, sampling-rate information and configured peak-to-peak axis span."><title>Device identifiers, sampling-rate information and configured peak-to-peak axis span.</title><text x="825" y="231" class="code" text-anchor="start">acquisition</text><text x="825" y="257" class="small" text-anchor="start">Device, rate, measurement span</text></g><g class="guide-node" tabindex="0" role="group" aria-label="Processing metadata may hold primary-five diagnostics, history and attached static/dynamic reports."><title>Processing metadata may hold primary-five diagnostics, history and attached static/dynamic reports.</title><text x="825" y="298" class="code" text-anchor="start">processing</text><text x="825" y="324" class="small" text-anchor="start">Decoding, diagnostics, reports</text></g><text x="600" y="422" class="body" text-anchor="middle">Four required columns; metadata, diagnostics and reports are optional.</text>
</svg>
